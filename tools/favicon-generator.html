<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Favicon generator</title>
  <style>
    @font-face {
      font-family: 'JetBrains Mono';
      font-weight: 100 800;
      src: url('../assets/fonts/jetbrains-mono-variable.woff2') format('woff2-variations');
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 48px;
      font-family: system-ui, sans-serif;
      color: #aaa;
    }
    .tile {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #22d88b;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-weight: 700;
      line-height: 1;
      border-radius: 22%;
      text-align: center;
      /* glyph sized against the box dimensions */
    }
    #f180 { width: 180px; height: 180px; font-size: 128px; }
    #f32  { width:  32px; height:  32px; font-size:  24px; border-radius: 5px; }
    #f16  { width:  16px; height:  16px; font-size:  13px; border-radius: 2px; }
    .caption { font-size: 11px; margin-top: 8px; text-align: center; }
    .group { display: flex; flex-direction: column; align-items: center; }
  </style>
</head>
<body>
  <div class="group">
    <div class="tile" id="f180">❯</div>
    <div class="caption">apple-touch-icon.png (180×180)</div>
  </div>
  <div class="group">
    <div class="tile" id="f32">❯</div>
    <div class="caption">favicon-32.png</div>
  </div>
  <div class="group">
    <div class="tile" id="f16">❯</div>
    <div class="caption">favicon-16.png</div>
  </div>
</body>
</html>
